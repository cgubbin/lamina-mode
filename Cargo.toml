[package]
name = "lamina-mode"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Modes of planar multilayers, with numerical evidence, fields and sensitivities"
license = "MIT OR Apache-2.0"
authors = ["Christopher R. Gubbin <cgubbin@gmail.com>"]
repository = "https://github.com/cgubbin/lamina-mode"
readme = "README.md"
keywords = ["photonics", "waveguide", "optics", "electromagnetics", "modes"]
categories = ["science", "mathematics"]
include = ["src/**/*.rs", "examples/**/*", "tests/**/*.rs", "docs/**/*.md", "Cargo.toml", "README.md", "CHANGELOG.md", "LICENSE*"]

[lib]
name = "lamina_mode"
path = "src/lib.rs"


[dependencies]
argloc = { version = "0.3.1", path = "../argloc" }

lamina-core = { version = "0.1.0", path = "../lamina-core" }
lamina-units = { version = "0.1.0", path = "../lamina-units" }
nalgebra = "0.33.3"
ndarray = "0.17.2"
num-traits = "0.2.19"

thiserror = "2.0.20"

[dev-dependencies]
lamina-materials = { version = "0.1.0", path = "../lamina-materials" }
approx = "0.5.1"
num-complex = "0.4.6"


[profile.dev]
debug = true

[profile.release]
codegen-units = 1
lto = "thin"

[workspace.metadata.release]
tag = true
push = true
publish = true
sign-commit = false
