[package]
name = "lamina-mode"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Rust project template with library and binary"
license = "MIT"

[lib]
name = "lamina_mode"
path = "src/lib.rs"


[dependencies]
argloc = { path = "../argloc" }

lamina-core = {path = "../lamina-core"}
lamina-materials = {path = "../lamina-materials"}
lamina-units = {path = "../lamina-units"}
nalgebra = "0.33.3"
ndarray = "0.17.2"
num-traits = "0.2.19"

thiserror = "2.0.20"

[dev-dependencies]
approx = "0.5.1"
num-complex = "0.4.6"


[profile.dev]
debug = true

[profile.release]
codegen-units = 1
lto = "thin"

[workspace.metadata.release]
tag = true
push = true
publish = true
sign-commit = false
