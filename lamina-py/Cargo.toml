[package]
name = "lamina-py"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Christopher R. Gubbin <cgubbin@gmail.com>"]
description = "Python bindings over the lamina-mode guided basis"
license = "MIT OR Apache-2.0"
repository = "https://github.com/cgubbin/lamina-mode"
readme = "README.md"
# Distributed as a Python wheel, not as a crate.
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
lamina-core = { version = "0.1.0", path = "../../lamina-core" }
lamina-materials = { version = "0.1.0", path = "../../lamina-materials" }
lamina-mode = { version = "0.1.0", path = ".." }
lamina-units = { version = "0.1.0", path = "../../lamina-units" }
ndarray = "0.17.2"
pyo3 = { version = "0.30.1", features = ["abi3-py310"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
sha2 = "0.11.1"
